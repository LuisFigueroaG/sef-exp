[project]
name = "sef-exp"
version = "0.1.0"
description = "Seleccion evolutiva por familias para scorecards, repo de experimentacion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "plotly>=5.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "numpy>=1.26",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sef_exp"]
