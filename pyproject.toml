[project]
name = "sef-exp"
version = "0.1.0"
description = "Seleccion evolutiva por familias para scorecards, repo de experimentacion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polars>=1.0",
  "plotly>=5.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "numpy>=1.26",
  "optbinning>=1.0.0",
  "kaleido>=1.4,<2",
  "statsmodels>=0.15.0",
  "optuna>=5.0.0",
  "lightgbm>=4.7.0",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sef_exp"]
